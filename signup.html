<!DOCTYPE html>
<html>
<head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light container mt-5">
    <div class="card mx-auto p-4 shadow" style="max-width: 400px;">
        <h3 class="text-center">Create Account</h3>
        <form method="POST" class="mt-3">
            <input name="username" class="form-control mb-3" placeholder="Choose Username" required>
            <input name="password" type="password" class="form-control mb-3" placeholder="Create Password" required>
            <button class="btn btn-primary w-100">Sign Up</button>
        </form>
        <p class="text-center mt-3">Already have an account? <a href="/login">Login</a></p>
    </div>
</body>
</html>
