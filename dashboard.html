<!DOCTYPE html>

<head><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="container mt-5">
    <div class="d-flex justify-content-between align-items-center">
        <h2>My Medicine Tracker</h2>
        <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
    </div>
    <hr>
    
    <div class="card p-4 bg-white mb-4 shadow-sm">
        <h4>Add Medicine</h4>
        <form method="POST" class="row g-3">
            <div class="col-md-4"><input name="name" class="form-control" placeholder="Medicine Name" required></div>
            <div class="col-md-3"><input name="dosage" class="form-control" placeholder="Dosage (e.g. 500mg)"></div>
            <div class="col-md-3"><input name="frequency" class="form-control" placeholder="Frequency (e.g. 2x Day)"></div>
            <div class="col-md-2"><button class="btn btn-primary w-100">Add</button></div>
        </form>
    </div>

    <h4>Your Medications</h4>
    <table class="table table-hover mt-3 shadow-sm">
        <thead class="table-dark">
            <tr><th>Name</th><th>Dosage</th><th>Frequency</th></tr>
        </thead>
        <tbody>
            
    <thead class="table-dark">
        <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Dosage</th>
            <th>Frequency</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        {% for med in user.meds %}
        <tr>
            <td>{{ med.date_added.strftime('%Y-%m-%d') }}</td>
            <td>{{ med.name }}</td>
            <td>{{ med.dosage }}</td>
            <td>{{ med.frequency }}</td>
            <td><a href="/delete/{{ med.id }}" class="btn btn-danger btn-sm">Delete</a></td>
        </tr>
        {% endfor %}
    </tbody>
        </tbody>
    </table>    
</body>
